* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);

.topo h2 b { font-weight: 600; }
.anos { display: flex; gap: 4px; flex-wrap: wrap; }
.anos button { font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 6px; border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; }
.anos button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.anos button:hover:not([aria-pressed="true"]) { background: var(--card); }
.quadro { border: 1px solid var(--line); border-radius: 6px; padding: 16px 16px 10px; }
.rolagem { overflow-x: auto; }
svg { display: block; }
svg text { fill: var(--fg); font-size: 11px; }
rect.d { rx: 2; ry: 2; }
rect.d:hover { stroke: var(--fg); stroke-width: 1; }
.rodape { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--muted); }
.legenda { display: flex; align-items: center; gap: 3px; }
.legenda i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.dica { position: fixed; pointer-events: none; background: var(--tip-bg); color: var(--tip-fg); font-size: 12px; padding: 6px 10px; border-radius: 6px; opacity: 0; transition: opacity .08s; z-index: 5; white-space: nowrap; }
.dica b { font-weight: 600; }
.numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0 32px; }
.numeros div { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
.numeros strong { display: block; font-size: 24px; font-weight: 600; line-height: 1.2; }
.numeros span { color: var(--muted); font-size: 12px; }
h3 { font-size: 16px; font-weight: 400; margin: 0 0 12px; }
.meses { display: grid; grid-template-columns: 90px minmax(0, 1fr) 150px; gap: 6px 12px; align-items: center; font-size: 13px; }
.meses .trilho { height: 8px; border-radius: 4px; background: var(--card); overflow: hidden; }
.meses .trilho i { display: block; height: 100%; background: var(--l3); border-radius: 4px; }
.meses .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.nota { margin-top: 32px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
@media (max-width: 560px) { .meses { grid-template-columns: 70px minmax(0, 1fr); } .meses .n { grid-column: 2; margin-top: -6px; } }

const MES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MESL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const fmt = n => n.toLocaleString('en-US');
const chave = dt => dt.toISOString().slice(0, 10);
const utc = s => new Date(s + 'T00:00:00Z');
const somaDias = (dt, n) => new Date(dt.getTime() + n * 864e5);
const hoje = utc(D.geradoEm);
const plural = (n, s) => `${fmt(n)} ${s}${n === 1 ? '' : 's'}`;
const dataLonga = k => { const d = utc(k); return `${MESL[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`; };
const dataCurta = k => { const d = utc(k); return `${MES[d.getUTCMonth()]} ${d.getUTCDate()}`; };
const v = k => (D.dias[k] || [0, 0])[0];

const anosComDados = [...new Set(Object.keys(D.dias).map(k => k.slice(0, 4)))].sort().reverse();
const periodos = [{ id: 'ultimo', rotulo: 'Last year', ini: somaDias(hoje, -364), fim: hoje }]
  .concat(anosComDados.map(a => ({ id: a, rotulo: a, ini: utc(a + '-01-01'), fim: a === D.geradoEm.slice(0, 4) ? hoje : utc(a + '-12-31') })));

function niveis(valores) {
  const nz = valores.filter(x => x > 0).sort((a, b) => a - b);
  if (!nz.length) return () => 0;
  const q = p => nz[Math.min(nz.length - 1, Math.floor(p * nz.length))];
  const [a, b, c] = [q(.25), q(.5), q(.75)];
  return x => x <= 0 ? 0 : x <= a ? 1 : x <= b ? 2 : x <= c ? 3 : 4;
}

function desenhar(per) {
  document.querySelectorAll('#anos button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === per.id));
  const inicio = somaDias(per.ini, -per.ini.getUTCDay());
  const nSem = Math.floor((per.fim - inicio) / 864e5 / 7) + 1;
  const T = 14, G = 3, P = T + G, X0 = 30, Y0 = 20;
  const dentro = [];
  for (let dt = per.ini; dt <= per.fim; dt = somaDias(dt, 1)) dentro.push(v(chave(dt)));
  const nv = niveis(dentro);
  const total = dentro.reduce((a, b) => a + b, 0);
  document.getElementById('titulo').innerHTML = per.id === 'ultimo'
    ? `<b>${fmt(total)}</b> contributions in the last year` : `<b>${fmt(total)}</b> contributions in ${per.id}`;
  const svg = document.getElementById('grade');
  const W = X0 + nSem * P, H = Y0 + 7 * P;
  svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('aria-label', `${total} contributions`);
  let s = '';
  [[1, 'Mon'], [3, 'Wed'], [5, 'Fri']].forEach(([d, r]) => { s += `<text x="0" y="${Y0 + d * P + 11}">${r}</text>`; });
  let mesAnt = -1, xAnt = -99;
  for (let w = 0; w < nSem; w++) {
    for (let d = 0; d < 7; d++) {
      const dt = somaDias(inicio, w * 7 + d);
      if (dt < per.ini || dt > per.fim) continue;
      const k = chave(dt);
      if ((dt.getUTCDate() <= 7 && d === 0) || (w === 0 && d === per.ini.getUTCDay())) {
        const m = dt.getUTCMonth(), x = X0 + w * P;

  }
  svg.innerHTML = s;

}

function numeros(per) {
  let ativos = 0, maior = 0, corr = 0, melhor = null, iniCorr = null, iniMaior = null, fimMaior = null;
  for (let dt = per.ini; dt <= per.fim; dt = somaDias(dt, 1)) {
    const k = chave(dt), x = v(k);
    if (x > 0) {
      ativos++; if (!corr) iniCorr = k; corr++;
      if (corr > maior) { maior = corr; iniMaior = iniCorr; fimMaior = k; }
      if (!melhor || x > melhor.x) melhor = { k, x };
    } else corr = 0;
  }
  let atual = 0;
  for (let dt = per.fim; dt >= per.ini; dt = somaDias(dt, -1)) {
    if (v(chave(dt)) > 0) atual++; else if (chave(dt) === D.geradoEm) continue; else break;
  }
  const totalDias = Math.round((per.fim - per.ini) / 864e5) + 1;
  document.getElementById('numeros').innerHTML = [
    [fmt(ativos), `active days, out of ${fmt(totalDias)}`],
    [plural(maior, 'day'), maior ? `longest streak (${dataCurta(iniMaior)} to ${dataCurta(fimMaior)})` : 'longest streak'],

  ].map(([a, b]) => `<div><strong>${a}</strong><span>${b}</span></div>`).join('');
}

function meses(per) {
  const porMes = {};
  for (let dt = per.ini; dt <= per.fim; dt = somaDias(dt, 1)) {
    const x = v(chave(dt)); if (!x) continue;
    const m = chave(dt).slice(0, 7);
    porMes[m] = (porMes[m] || 0) + x;
  }
  const ms = Object.keys(porMes).sort().reverse();
  const max = Math.max(1, ...ms.map(m => porMes[m]));
  document.getElementById('meses').innerHTML = ms.map(m => {
    const [a, mm] = m.split('-');
    return `<span>${MES[+mm - 1]} ${a}</span><span class="trilho"><i style="width:${Math.max(2, porMes[m] / max * 100)}%"></i></span><span class="n">${plural(porMes[m], 'contribution')}</span>`;
  }).join('') || '<span class="n">No contributions in this period.</span>';
}

anos.innerHTML = periodos.map(p => `<button type="button" data-id="${p.id}">${p.rotulo}</button>`).join('');
anos.addEventListener('click', e => { const b = e.target.closest('button'); if (b) desenhar(periodos.find(p => p.id === b.dataset.id)); });

grade.addEventListener('mousemove', e => {

  `Read from the edit history of ${fmt(D.projetos)} Overleaf projects across my accounts; days in Brasília time; edits by co-authors alone do not count. Updated ${dataLonga(D.geradoEm)}.`;

</script>
